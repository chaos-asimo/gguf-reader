[package]
name = "gguf"
version = "0.1.0"
edition = "2021"
description = "GGUF (GGML Universal Format) metadata reader for LLM model files"
license = "MIT"
authors = ["model_study"]
repository = "https://github.com/model-study/gguf-reader"

[lib]
name = "gguf"
path = "src/lib.rs"

[[bin]]
name = "gguf-dump"
path = "src/bin/gguf_dump.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
memmap2 = { version = "0.9", optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["mmap", "json"]
mmap = ["dep:memmap2"]
json = ["dep:serde_json"]

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
